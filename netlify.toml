# UMADBAP — configuração da Netlify
# O site é estático (CDN mundial, aguenta picos de acesso). Só os formulários
# passam por funções (netlify/functions), com limite de envios por pessoa.

[build]
  publish = "publico"
  functions = "netlify/functions"

# Segurança básica em todas as páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fotos, vídeos, fontes e logo mudam raramente: cache longo no celular da pessoa
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Respostas da API nunca ficam em cache
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
